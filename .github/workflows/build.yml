name: Build and Package e_prescriptions

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSBuild Path
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet Packages
        run: msbuild e_prescriptions.sln /t:Restore /p:Configuration=Release /p:Platform="Any CPU"

      - name: Build Solution
        run: msbuild e_prescriptions.sln /p:Configuration=Release /p:Platform="Any CPU" /m /v:m

      - name: Run Tests
        run: dotnet test tests/ePrescriptions.Tests/ePrescriptions.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test_results.trx"

      - name: Verify Test Results Counters
        shell: pwsh
        run: |
          $trx = Get-ChildItem -Path "tests/ePrescriptions.Tests/TestResults" -Filter "*.trx" -Recurse | Select-Object -First 1
          if (-not $trx) { throw "لم يتم العثور على ملف نتائج الاختبارات .trx" }
          [xml]$xml = Get-Content $trx.FullName
          $counters = $xml.TestRun.ResultSummary.Counters
          $executed = [int]$counters.executed
          $failed = [int]$counters.failed
          Write-Host "Executed tests: $executed, Failed tests: $failed"
          if ($executed -le 0) { throw "لم يتم تنفيذ أي اختبار!" }
          if ($failed -gt 0) { throw "فشل $failed اختبار!" }

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\e_prescriptions_installer.iss

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: e_prescriptions_Setup
          path: dist/installer/*

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/ePrescriptions.Tests/TestResults/*.trx
